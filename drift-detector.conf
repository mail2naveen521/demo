# =============================================================================
# WebSphere ND 8.5.5 + HCL Portal 9.5 Configuration Drift Detector
# Tested target: RHEL 8
# =============================================================================

# --- WebSphere ND 8.5.5 ------------------------------------------------------
WAS_HOME="${WAS_HOME:-/opt/IBM/WebSphere/AppServer}"
WAS_PROFILE_ROOT="${WAS_PROFILE_ROOT:-/opt/IBM/WebSphere}"

# IMPORTANT for Portal: the WAS profile that hosts Portal is wp_profile, NOT
# the WAS-default AppSrv01. Set this to the profile you want to monitor.
#   - Standalone Portal:       wp_profile
#   - Dmgr in a Portal cluster: dmgr_profile  (run detector on Dmgr host)
#   - Plain WAS ND only:       AppSrv01 or Dmgr01
WAS_PROFILE_NAME="${WAS_PROFILE_NAME:-wp_profile}"
WAS_CELL_NAME="${WAS_CELL_NAME:-wpCell}"

# Directories inside the profile to monitor (relative to profile root).
# Includes PortalServer/config which holds portal-specific service overrides.
WAS_WATCH_DIRS="config/cells properties PortalServer/config ConfigEngine/properties"

# --- HCL Portal 9.5 ----------------------------------------------------------
# PortalServer_root is the product binary tree
PORTAL_HOME="${PORTAL_HOME:-/opt/IBM/WebSphere/PortalServer}"

# wp_profile_root — the live profile. Portal config that drifts lives HERE,
# not under PORTAL_HOME (which is mostly read-only product binaries).
PORTAL_PROFILE="${PORTAL_PROFILE:-${WAS_PROFILE_ROOT}/${WAS_PROFILE_NAME}}"

# Directories that hold mutable portal config
# Per HCL docs (help.hcl-software.com/digital-experience/9.5):
#   - Portal service properties: wp_profile/PortalServer/config
#   - WCM service properties:    wp_profile/PortalServer/wcm/shared/app/config/wcmservices
PORTAL_CONFIG_DIR="${PORTAL_PROFILE}/PortalServer/config"
PORTAL_WCM_CONFIG_DIR="${PORTAL_PROFILE}/PortalServer/wcm/shared/app/config/wcmservices"
# Legacy name kept for compatibility with the snapshot library — points to WCM config
PORTAL_PROPERTIES_DIR="${PORTAL_WCM_CONFIG_DIR}"
PORTAL_THEMES_DIR="${PORTAL_HOME}/theme"

# xmlaccess.sh in Portal 9.5 lives under wp_profile, not PortalServer_root
PORTAL_XMLACCESS_SCRIPT="${PORTAL_PROFILE}/PortalServer/bin/xmlaccess.sh"
PORTAL_ADMIN_USER="${PORTAL_ADMIN_USER:-wpsadmin}"
PORTAL_ADMIN_PASS_FILE="${PORTAL_ADMIN_PASS_FILE:-/etc/drift-detector/portal.pass}"
# Portal 9.5 default config URL
PORTAL_ADMIN_URL="${PORTAL_ADMIN_URL:-http://localhost:10039/wps/config}"

# --- File patterns to include / exclude --------------------------------------
INCLUDE_PATTERNS="*.xml *.properties *.policy *.props *.cfg *.json"
# Exclude WAS/Portal transient and cache directories that change on every restart
EXCLUDE_PATTERNS="*.log *.tmp *.bak *.lck *.pid temp/* logs/* wstemp/* tranlog/* config/temp/* PortalServer/log/* installedApps/*"

SCRUB_PATTERNS_FILE="${SCRUB_PATTERNS_FILE:-/opt/drift-detector/config/scrub-patterns.txt}"

# --- Baseline & report locations --------------------------------------------
BASELINE_DIR="${BASELINE_DIR:-/opt/drift-detector/baselines}"
REPORT_DIR="${REPORT_DIR:-/opt/drift-detector/reports}"
LOG_DIR="${LOG_DIR:-/opt/drift-detector/logs}"
DIFF_SNAPSHOT_DIR="${DIFF_SNAPSHOT_DIR:-${BASELINE_DIR}/snapshots}"
REPORT_RETENTION=30

# --- Email settings ----------------------------------------------------------
MAIL_ENABLED="${MAIL_ENABLED:-true}"
MAIL_FROM="${MAIL_FROM:-drift-detector@example.com}"
MAIL_TO="${MAIL_TO:-platform-ops@example.com,security@example.com}"
MAIL_SUBJECT_PREFIX="${MAIL_SUBJECT_PREFIX:-[DRIFT]}"
MAIL_SMTP_HOST="${MAIL_SMTP_HOST:-smtp.example.com}"
MAIL_SMTP_PORT="${MAIL_SMTP_PORT:-25}"
MAIL_SMTP_USER="${MAIL_SMTP_USER:-}"
MAIL_SMTP_PASS_FILE="${MAIL_SMTP_PASS_FILE:-}"
MAIL_USE_TLS="${MAIL_USE_TLS:-false}"
MAIL_ON_DRIFT_ONLY="${MAIL_ON_DRIFT_ONLY:-true}"
MAIL_INLINE_DIFF_BYTES=8192

HOSTNAME_TAG="$(hostname -s 2>/dev/null || echo unknown)"
